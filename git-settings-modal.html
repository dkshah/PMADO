<div id="gitSettingsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fab fa-git-alt"></i> Git Configuration</h2>
            <span class="close">&times;</span>
        </div>
        <form id="gitSettingsForm">
            <div class="form-section">
                <h3><i class="fas fa-server"></i> Git Provider</h3>
                <div class="form-group">
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="gitProvider" value="github" checked>
                            <i class="fab fa-github"></i> GitHub
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="gitProvider" value="azure">
                            <i class="fab fa-microsoft"></i> Azure DevOps
                        </label>
                    </div>
                </div>
            </div>

            <!-- GitHub Settings -->
            <div id="githubSettings" class="provider-settings">
                <h3><i class="fab fa-github"></i> GitHub Settings</h3>
                <div class="form-group">
                    <label for="githubUsername">GitHub Username/Organization:</label>
                    <input type="text" id="githubUsername" placeholder="your-username-or-org" required>
                </div>
                <div class="form-group">
                    <label for="githubToken">Personal Access Token:</label>
                    <input type="password" id="githubToken" placeholder="GitHub PAT with repo scope" required>
                    <small>Create at: <a href="https://github.com/settings/tokens" target="_blank">GitHub Tokens</a> (needs 'repo' scope)</small>
                </div>
                <div class="form-group">
                    <label for="githubRepo">Repository Name:</label>
                    <input type="text" id="githubRepo" placeholder="repository-name" required>
                </div>
            </div>

            <!-- Azure DevOps Settings -->
            <div id="azureSettings" class="provider-settings" style="display: none;">
                <h3><i class="fab fa-microsoft"></i> Azure DevOps Settings</h3>
                <div class="form-group">
                    <label for="azureOrg">Organization:</label>
                    <input type="text" id="azureOrg" placeholder="your-organization">
                </div>
                <div class="form-group">
                    <label for="azureProject">Project:</label>
                    <input type="text" id="azureProject" placeholder="project-name">
                </div>
                <div class="form-group">
                    <label for="azureRepo">Repository Name:</label>
                    <input type="text" id="azureRepo" placeholder="repository-name">
                </div>
                <div class="form-group">
                    <label for="azurePat">Personal Access Token:</label>
                    <input type="password" id="azurePat" placeholder="Azure DevOps PAT">
                    <small>Create at: <a href="https://dev.azure.com/your-org/_usersSettings/tokens" target="_blank">Azure DevOps Tokens</a> (needs 'Code - Read' scope)</small>
                </div>
            </div>

            <!-- Common Settings -->
            <div class="form-section">
                <h3><i class="fas fa-cog"></i> General Settings</h3>
                <div class="form-group">
                    <label for="defaultBranch">Default Branch:</label>
                    <input type="text" id="defaultBranch" value="main" required>
                </div>
                <div class="form-group">
                    <label for="teamMembers">Team Members (comma-separated emails):</label>
                    <textarea id="teamMembers" rows="3" placeholder="user1@example.com, user2@example.com"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" id="testConnectionBtn" class="btn btn-secondary">
                    <i class="fas fa-plug"></i> Test Connection
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save Settings
                </button>
            </div>
        </form>
    </div>
</div>
